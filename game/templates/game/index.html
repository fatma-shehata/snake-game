<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{{ game_title|title }}</title>
</head>

<body>
    <h1>{{ game_title|upper }}</h1>
    <div id="info">
        <span>Score: <span id="score">0</span></span>
        <span>Best: <span id="best">0</span></span>
    </div>
    {% if rules %}
    <ul class="rules">
        {% for rule in rules %}
        <li>{{ forloop.counter }}. {{ rule }}</li>
        {% endfor %}
    </ul>
    {% endif %}
    <canvas id="game" width="400" height="400"></canvas>
    <div id="hint">Use arrow keys or WASD to move</div>
    <button id="restart">Play Again</button>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const bestEl = document.getElementById('best');
        const restartBtn = document.getElementById('restart');

        const size = 20;
        const tiles = canvas.width / size;

        let snake, dir, nextDir, food, score, best, gameOver, loopId;

        best = Number(localStorage.getItem('snakeBest') || 0);
        bestEl.textContent = best;

        function init() {
            snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
            dir = { x: 1, y: 0 };
            nextDir = { x: 1, y: 0 };
            score = 0;
            gameOver = false;
            scoreEl.textContent = score;
            restartBtn.style.display = 'none';
            placeFood();
            if (loopId) clearInterval(loopId);
            loopId = setInterval(tick, 110);
        }

        function placeFood() {
            let valid = false;
            while (!valid) {
                food = {
                    x: Math.floor(Math.random() * tiles),
                    y: Math.floor(Math.random() * tiles)
                };
                valid = !snake.some(s => s.x === food.x && s.y === food.y);
            }
        }

        function tick() {
            dir = nextDir;
            const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

            if (head.x < 0 || head.y < 0 || head.x >= tiles || head.y >= tiles ||
                snake.some(s => s.x === head.x && s.y === head.y)) {
                endGame();
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = score;
                placeFood();
            } else {
                snake.pop();
            }

            draw();
        }

        function draw() {
            ctx.fillStyle = getComputedStyle(canvas).backgroundColor;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // grid lines
            ctx.strokeStyle = 'rgba(255,255,255,0.03)';
            for (let i = 0; i <= tiles; i++) {
                ctx.beginPath();
                ctx.moveTo(i * size, 0); ctx.lineTo(i * size, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * size); ctx.lineTo(canvas.width, i * size);
                ctx.stroke();
            }

            // food
            ctx.fillStyle = '#f97316';
            ctx.beginPath();
            ctx.arc(food.x * size + size / 2, food.y * size + size / 2, size / 2.5, 0, Math.PI * 2);
            ctx.fill();

            // snake
            snake.forEach((s, i) => {
                ctx.fillStyle = i === 0 ? '#a3e635' : '#4ade80';
                ctx.fillRect(s.x * size + 1, s.y * size + 1, size - 2, size - 2);
            });
        }

        function endGame() {
            gameOver = true;
            clearInterval(loopId);
            if (score > best) {
                best = score;
                localStorage.setItem('snakeBest', best);
                bestEl.textContent = best;
            }
            restartBtn.style.display = 'inline-block';
            ctx.fillStyle = 'rgba(0,0,0,0.55)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 28px Segoe UI';
            ctx.textAlign = 'center';
            ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2);
        }

        document.addEventListener('keydown', e => {
            const key = e.key.toLowerCase();
            if ((key === 'arrowup' || key === 'w') && dir.y === 0) nextDir = { x: 0, y: -1 };
            else if ((key === 'arrowdown' || key === 's') && dir.y === 0) nextDir = { x: 0, y: 1 };
            else if ((key === 'arrowleft' || key === 'a') && dir.x === 0) nextDir = { x: -1, y: 0 };
            else if ((key === 'arrowright' || key === 'd') && dir.x === 0) nextDir = { x: 1, y: 0 };
        });

        restartBtn.addEventListener('click', init);

        init();
    </script>
</body>

</html>
